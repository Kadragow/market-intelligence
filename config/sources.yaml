# RSS feeds for headlines (docs/SPEC.md §4). To be filled in by the operator.
# The agent does not guess feed URLs. Only titles, links, dates and short RSS
# leads are stored, never full articles.
#
# Example entry:
#   - id: example_markets
#     name: Example Markets
#     url: https://example.com/markets/rss
#     category: finance        # finance | macro | technology | ai | semiconductors

feeds:
  # Finance
  - id: bloomberg_markets
    name: Bloomberg Markets
    url: https://feeds.bloomberg.com/markets/news.rss
    category: finance

  - id: cnbc_finance
    name: CNBC Finance
    url: https://www.cnbc.com/id/10000664/device/rss/rss.html
    category: finance

  - id: marketwatch
    name: MarketWatch Top Stories
    url: https://feeds.marketwatch.com/marketwatch/topstories/
    category: finance

  - id: ft_markets
    name: Financial Times Markets
    url: https://www.ft.com/markets?format=rss
    category: finance

  # Macro
  - id: federal_reserve
    name: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_all.xml
    category: macro

  - id: ecb
    name: European Central Bank
    url: https://www.ecb.europa.eu/rss/press.html
    category: macro

  - id: economist_macro
    name: The Economist - Finance and Economics
    url: https://www.economist.com/finance-and-economics/rss.xml
    category: macro

  # Technology
  - id: techcrunch
    name: TechCrunch
    url: https://techcrunch.com/feed/
    category: technology

  - id: ars_technica
    name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    category: technology

  - id: verge
    name: The Verge
    url: https://www.theverge.com/rss/index.xml
    category: technology

  # AI
  - id: openai_news
    name: OpenAI
    url: https://openai.com/news/rss.xml
    category: ai

  - id: google_ai
    name: Google AI
    url: https://blog.google/technology/ai/rss/
    category: ai

  - id: deepmind
    name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    category: ai

  - id: huggingface
    name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    category: ai

  - id: mit_technology_review_ai
    name: MIT Technology Review AI
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    category: ai

  # Semiconductors
  - id: bloomberg_technology
    name: Bloomberg Technology
    url: https://feeds.bloomberg.com/technology/news.rss
    category: semiconductors

  - id: nvidia_blog
    name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    category: semiconductors

